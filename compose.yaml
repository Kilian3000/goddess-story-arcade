services:
  arcade:
    build:
      context: .
      args:
        NEXT_PUBLIC_ARCADE_TITLE: ${NEXT_PUBLIC_ARCADE_TITLE:-Goddess Story Arcade}
        NEXT_PUBLIC_ARCADE_BRAND_LEAD: ${NEXT_PUBLIC_ARCADE_BRAND_LEAD:-GODDESS}
        NEXT_PUBLIC_ARCADE_BRAND_ACCENT: ${NEXT_PUBLIC_ARCADE_BRAND_ACCENT:-.STORY}
        NEXT_PUBLIC_ARCADE_TAGLINE: ${NEXT_PUBLIC_ARCADE_TAGLINE:-CARD ARCADE}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_CARD_DATABASE_URL: ${NEXT_PUBLIC_CARD_DATABASE_URL:-/card-data/db.js}
        NEXT_PUBLIC_CARD_IMAGE_ROOT: ${NEXT_PUBLIC_CARD_IMAGE_ROOT:-/card-data/}
    ports:
      - "3000:3000"
    restart: unless-stopped
